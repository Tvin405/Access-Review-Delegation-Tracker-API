info:
  name: Purge Access Reviews
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/access-reviews"
  headers:
    - name: x-api-key
      value: "{{apikey}}"
    - name: x-admin-key
      value: "{{adminkey}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
